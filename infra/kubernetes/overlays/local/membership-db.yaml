apiVersion: "v1"
kind: "Service"
metadata:
  name: "membership-db"
spec:
  selector:
    app: "membership-db"
  ports:
    -
      name: "postgres"
      port: 5432
      targetPort: 5432
---
apiVersion: "apps/v1"
kind: "StatefulSet"
metadata:
  name: "membership-db"
spec:
  serviceName: "membership-db"
  replicas: 1
  selector:
    matchLabels:
      app: "membership-db"
  template:
    metadata:
      labels:
        app: "membership-db"
    spec:
      containers:
        -
          name: "postgres"
          image: "postgres:16"
          envFrom:
            -
              secretRef:
                name: "membership-db-config"
          env:
            -
              name: "PGDATA"
              value: "/var/lib/postgresql/data/pgdata"
          ports:
            -
              containerPort: 5432
          readinessProbe:
            exec:
              command:
                - "sh"
                - "-c"
                - "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"
          volumeMounts:
            -
              name: "data"
              mountPath: "/var/lib/postgresql/data"
  volumeClaimTemplates:
    -
      metadata:
        name: "data"
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"
