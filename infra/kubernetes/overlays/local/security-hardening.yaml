# Local overlay only. Preserve existing PostgreSQL PVCs.
# Verify image postgres UID/GID 999:999 and redis UID/GID 999:1000 before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gym-lmf
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: auth-service
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      initContainers:
      - name: initialize-local-schema
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 64Mi
---
