apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: auth-db
spec:
  template:
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: postgres
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: runtime-tmp
          mountPath: /tmp
        - name: postgres-run
          mountPath: /var/run/postgresql
      volumes:
      - name: runtime-tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: postgres-run
        emptyDir:
          sizeLimit: 16Mi
