apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gym-lmf
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DiegoRiveraTM/gimnasio_los_mas_fuertes
    targetRevision: main
    path: infra/kubernetes/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: gym-lmf
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true